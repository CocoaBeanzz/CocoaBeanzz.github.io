### Posts ###
# Fallback only. Every post lives in a department folder, and the
# "Departments" defaults below give it /<department>/blog/:title.
permalink: /blog/:title

related_posts:
  min_shared: 1          # minimum non-common shared tags required
  max_results: 6         # cap how many related posts are stored
  common_tag_ratio: 0.25 # tags appearing in >25% of posts are treated as "common"

### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name

