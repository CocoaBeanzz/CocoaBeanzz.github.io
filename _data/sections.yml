# The departments of kaud.io, in the order they appear on the hub.
#
# id      Folder name used under _projects/, _posts/ and pages/, and the
#         path prefix (kaud.io/<id>/). Must match the "Departments" block
#         in _config.yml and SECTIONS in cloudflare/section-proxy/worker.js.
# title   Name shown on the hub panel and in the navbar.
# hero    Image for the hub panel and the top of the department landing.
#         One path, or a list of them. With a list, the landing slides from
#         one to the next every few seconds, and the hub panel uses the first.
#         A list entry can also say which part of that image to keep in view
#         when it is cropped to a wide banner:
#             - { image: /docs/..., position: "center 20%" }
# hero_position
#         Optional. The same crop setting for a single `hero`, or the default
#         for list entries that do not set their own. A CSS object-position
#         ("center 20%" keeps the upper part). Defaults to the middle.
# accent  Exposed to CSS as --section-accent on every page of the department.
# parent  Optional. Id of the department this one sits under. A department
#         with children is a branching page (kaud.io/music/ shows K Presto
#         and CocoaBeanz as panels) and has no content of its own. Children
#         are full departments with their own folders, navbar and address.
#         kaud.io itself shows only departments without a parent.
# hide_role_and_tools
#         Optional. true keeps a project's `role` and `tools` off this
#         department's tiles, featured rows and filters. For a storefront
#         (Tools), where buyers don't care who built it or with what. The
#         same project still shows both wherever it is crossposted (Dev).
#
# To add a department: add an entry here, three lines to the "Departments"
# block in _config.yml, the id to the Worker's SECTIONS list, and create the
# three folders.

- id: music
  title: Music
  hero: /docs/assets/images/projects/k-presto/BLiND/Cleveland/BLiND_Cleveland_1.jpg   # PLACEHOLDER hero image
  hero_position: center 22%
  accent: "#7c4f9b"

- id: kpresto
  title: K Presto
  parent: music
  hero:   
    - { image: /docs/assets/images/projects/k-presto/BLiND/Cleveland/BLiND_Cleveland_1.jpg, position: "center 22%" }
