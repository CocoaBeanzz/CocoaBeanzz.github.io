# The Kouncil product page's feature table (_projects/tools/(2610) Kouncil.html).
# One group per area; each row is a feature and what each edition gets:
#   true   included
#   false  not included
#   text   included in part, said in a few words ("2 of 8")
# Lite is the depth-limited edition decided 2026-10-23 (Kouncil_Marketing/
# MARKETING.md, "Editions"): every tab and every kind of result, at the level
# of where the problem is; the full version adds the exact figures, the fixes
# and the tools that pinpoint. Keep this file and that table in step.

